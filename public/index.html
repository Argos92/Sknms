<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Скинемся</title>

<style>
:root{
    --primary:#c86cf6;
    --primary-dark:#0b1b59;
    --bg:#f3f4f8;
    --card:#ffffff;
    --text:#2c3553;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    background:var(--bg);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    background:var(--card);
    width:100%;
    max-width:420px;
    border-radius:24px;
    padding:32px 24px;
    text-align:center;
    box-shadow:0 8px 32px rgba(0,0,0,.08);
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:20px;
    background:#e8f5ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

h1{
    color:var(--text);
    margin-top:20px;
    font-size:28px;
}

.subtitle{
    color:#7a8095;
    margin-top:8px;
}

.event-box{
    margin-top:24px;
    background:#f7f7fb;
    padding:16px;
    border-radius:14px;
}

.event-id{
    font-size:20px;
    font-weight:600;
    color:var(--primary-dark);
}

.buttons{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.btn{
    text-decoration:none;
    padding:16px;
    border-radius:14px;
    font-weight:600;
    display:block;
}

.btn-open{
    background:var(--primary-dark);
    color:white;
}

.btn-appstore{
    background:var(--primary);
    color:white;
}

.btn-play{
    border:2px solid var(--primary);
    color:var(--primary);
}

.footer{
    margin-top:24px;
    font-size:12px;
    color:#999;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        💸
    </div>

    <h1>Скинемся</h1>

    <div class="subtitle">
        Открытие события
    </div>

    <div class="event-box">
        <div>Номер события</div>
        <div class="event-id" id="eventId">...</div>
    </div>

    <div class="buttons">

        <a id="openApp"
           class="btn btn-open"
           href="#">
            Открыть приложение
        </a>

        <a
           class="btn btn-appstore"
           href="https://apps.apple.com/app/id6762391510">
            App Store
        </a>

        <a
           class="btn btn-play"
           href="https://play.google.com/store/apps/details?id=com.mycompany.scnms">
            Google Play
        </a>

    </div>

    <div class="footer">
        Разделение расходов без лишней математики
    </div>

</div>

<script>

const path = window.location.pathname;

/*
ожидаем

/event/abc123
*/

let eventId = '';

const parts = path.split('/');

if(parts.length >= 3 && parts[1] === 'event'){
    eventId = parts[2];
}

document.getElementById('eventId').innerText =
    eventId || 'Не указан';

const appUrl =
    `sknms://sknms.ru/event/${eventId}`;

document
    .getElementById('openApp')
    .href = appUrl;

/*
автопопытка открыть приложение
*/

setTimeout(() => {
    window.location.href = appUrl;
}, 500);

</script>

</body>
</html>
