<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Скинемся — Открыть событие</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;

      background: white;

      border-radius: 20px;

      padding: 32px 24px;

      box-sizing: border-box;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;

      font-size: 32px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    .event-box {
      margin-top: 20px;
      margin-bottom: 24px;

      background: #f0f3f7;

      border-radius: 12px;

      padding: 14px;

      word-break: break-word;

      font-size: 14px;

      color: #333;
    }

    .btn {
      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 16px;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      margin-top: 12px;

      transition: 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #007AFF;
      color: white;
    }

    .btn-secondary {
      background: #111;
      color: white;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #ddd;
      color: #333;
    }

    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Скинемся</h1>

  <p>
    Откройте событие в приложении
  </p>

  <div class="event-box">
    Event ID:
    <span id="event-id">...</span>
  </div>

  <button
    class="btn btn-primary"
    id="open-app-btn"
  >
    Открыть приложение
  </button>

  <button
    class="btn btn-secondary"
    id="ios-btn"
  >
    Скачать для iPhone
  </button>

  <button
    class="btn btn-outline"
    id="android-btn"
  >
    Скачать для Android
  </button>

  <div class="footer">
    Если приложение уже установлено —
    нажмите «Открыть приложение»
  </div>

</div>

<script>
(function () {

  // =========================================
  // CONFIG
  // =========================================

  const IOS_STORE_URL =
    'https://testflight.apple.com/join/Qvj8xae2';

  const ANDROID_STORE_URL =
    'https://play.google.com/store/apps/details?id=com.yourcompany.splitpay';

  // =========================================

  const params =
    new URLSearchParams(window.location.search);

  const eventId =
    params.get('id');

  const eventIdElement =
    document.getElementById('event-id');

  if (!eventId) {

    eventIdElement.innerText =
      'eventId not found';

    return;
  }

  eventIdElement.innerText =
    eventId;

  // =========================================
  // DEEP LINK
  // =========================================

  const deepLink =
    `sknms://event/${eventId}`;

  console.log('Deep link:', deepLink);

  // =========================================
  // BUTTONS
  // =========================================

  document
    .getElementById('open-app-btn')
    .onclick = () => {

      window.location.href =
        deepLink;
    };

  document
    .getElementById('ios-btn')
    .onclick = () => {

      window.location.href =
        IOS_STORE_URL;
    };

  document
    .getElementById('android-btn')
    .onclick = () => {

      window.location.href =
        ANDROID_STORE_URL;
    };

})();
</script>

</body>
</html>
